<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Démineur</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="topbar__left">
        <label for="difficulty" class="label">Difficulté</label>
        <select id="difficulty" class="select" aria-label="Choisir la difficulté">
          <option value="beginner">Débutant — 9×9, 10 mines</option>
          <option value="intermediate">Intermédiaire — 16×16, 40 mines</option>
          <option value="expert">Expert — 30×16, 99 mines</option>
          <option value="custom">Personnalisé…</option>
        </select>
        <div id="custom-settings" class="custom" hidden>
          <div class="custom__row">
            <label for="rows">Lignes</label>
            <input id="rows" type="number" min="5" max="50" value="9" />
          </div>
          <div class="custom__row">
            <label for="cols">Colonnes</label>
            <input id="cols" type="number" min="5" max="50" value="9" />
          </div>
          <div class="custom__row">
            <label for="mines">Mines</label>
            <input id="mines" type="number" min="1" value="10" />
          </div>
          <button id="apply-custom" class="button">Appliquer</button>
        </div>
      </div>

      <div class="topbar__center">
        <div class="counter" id="mine-counter" aria-label="Mines restantes">010</div>
        <button id="reset-btn" class="reset" aria-label="Nouvelle partie" title="Nouvelle partie">🙂</button>
        <div class="counter" id="timer" aria-label="Temps écoulé">000</div>
      </div>

      <div class="topbar__right">
        <button id="flag-toggle" class="toggle" aria-pressed="false" title="Mode drapeau (mobile)">🚩 Mode drapeau</button>
      </div>
    </header>

    <section id="board" class="board" role="grid" aria-label="Plateau de Démineur"></section>
  </main>

  <script src="main.js"></script>
</body>
</html>
